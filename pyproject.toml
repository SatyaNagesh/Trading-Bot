[tool.poetry]
name = "quantlab-ai"
version = "0.1.0"
description = "AI-augmented quantitative research operating system"
authors = ["Satya Nagesh"]
readme = "README.md"
license = "MIT"

[tool.poetry.dependencies]
python = "^3.13"
fastapi = "^0.115"
uvicorn = {version = "^0.30", extras = ["standard"]}
pydantic = "^2.0"
pydantic-settings = "^2.0"
sqlalchemy = "^2.0"
alembic = "^1.13"
asyncpg = "^0.30"
redis = "^5.0"
httpx = "^0.27"
pandas = "^2.0"
numpy = "^2.0"
scipy = "^1.14"
scikit-learn = "^1.5"
statsmodels = "^0.14"
structlog = "^24.0"
opentelemetry-api = "^1.25"
opentelemetry-sdk = "^1.25"
backtesting = "^0.4"
python-dotenv = "^1.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-asyncio = "^0.24"
pytest-cov = "^5.0"
ruff = "^0.5"
mypy = "^1.10"
pre-commit = "^3.0"
coverage = "^7.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B", "SIM", "ARG"]

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
