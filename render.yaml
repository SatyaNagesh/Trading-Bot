# QuantLab paper integration — Render Blueprint
# PAPER ONLY. Live trading is hard-blocked at every layer (env, risk, broker, gateway).
# No secret VALUES live in this file — only env NAMES. Values are set in Render's
# dashboard secret store (or GitHub Actions) and are NEVER committed to git.
#
# Service name picked by Render; public callback becomes:
#   https://<service>.onrender.com/webhook/tradingview
#
# Start command:
#   poetry run python -m uvicorn services.api.main:app --host 0.0.0.0 --port ${PORT:-8000}

services:
  - type: web
    name: quantlab-trading-postgres-paper
    runtime: python
    plan: free
    buildCommand: |
      poetry config virtualenvs.in-project true
      poetry install --without dev
    startCommand: |
      poetry run python -m uvicorn services.api.main:app --host 0.0.0.0 --port ${PORT:-8000}
    healthCheckPath: /health
    envVars:
      - key: QUANTLAB_API_HOST
        value: 0.0.0.0
      - key: QUANTLAB_API_PORT
        sync: false
        value: ${PORT:-8000}
      - key: QUANTLAB_PAPER_ONLY
        value: "true"
      - key: QUANTLAB_PAPER_TRADING
        value: "true"
      - key: QUANTLAB_LIVE_TRADING_ENABLED
        value: "false"
      - key: QUANTLAB_LIVE_GUARD
        value: "true"
      - key: QUANTLAB_TRADINGVIEW_ENABLED
        value: "true"
      - key: QUANTLAB_TV_WEBHOOK_ENABLED
        value: "true"
      - key: QUANTLAB_KILL_SWITCH
        value: "false"
      # --- Discord (name only; value via Render secret store) ---
      - key: QUANTLAB_DISCORD_ENABLED
        value: "true"
      # Discord Bot HTTP (REST) API transport — migrated from legacy webhook
      # (commit 5fe8e6a). Token + channel ID must be set in the secret store;
      # without them the notifier is a harmless no-op (fail-closed).
      - key: QUANTLAB_DISCORD_BOT_TOKEN
        sync: false
      - key: QUANTLAB_DISCORD_CHANNEL_ID
        sync: false
      # --- TradingView secret (name only; value via Render secret store) ---
      # Code reads exactly QUANTLAB_WEBHOOK_SECRET (packages/webhook/tradingview.py).
      - key: QUANTLAB_WEBHOOK_SECRET
        sync: false
      # X-QuantLab-Webhook-Token header value is validated against this secret.
