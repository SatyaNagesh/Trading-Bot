[tool.poetry]
name = "quantlab-api"
version = "0.1.0"
description = "QuantLab AI — Unified REST API + WebSocket Layer"
authors = ["Satya Nagesh"]

[tool.poetry.dependencies]
python = "^3.13"
fastapi = "^0.115"
uvicorn = {version = "^0.30", extras = ["standard"]}
pydantic = "^2.0"
httpx = "^0.27"
structlog = "^24.0"
python-dotenv = "^1.0"
pyyaml = "^6.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
