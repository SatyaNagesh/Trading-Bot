apiVersion: apps/v1
kind: Deployment
metadata:
  name: risk-engine
  namespace: quantlab
spec:
  replicas: 2
  selector:
    matchLabels:
      app: risk-engine
  template:
    metadata:
      labels:
        app: risk-engine
    spec:
      containers:
      - name: risk
        image: quantlab/risk:latest
        ports:
        - containerPort: 8003
        resources:
          requests:
            cpu: 250m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: risk-engine
  namespace: quantlab
spec:
  selector:
    app: risk-engine
  ports:
  - port: 8003
    targetPort: 8003
