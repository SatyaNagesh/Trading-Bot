apiVersion: v1
kind: ConfigMap
metadata:
  name: quantlab-config
  namespace: quantlab
data:
  LOG_LEVEL: "INFO"
  RABBITMQ_HOST: "rabbitmq"
  RABBITMQ_PORT: "5672"
  REDIS_URL: "redis://redis:6379/0"
  QDRANT_HOST: "qdrant"
  QDRANT_PORT: "6333"
  NEO4J_URI: "bolt://neo4j:7687"
  MINIO_ENDPOINT: "minio:9000"
  PROMETHEUS_PORT: "9090"
---
apiVersion: v1
kind: Secret
metadata:
  name: quantlab-secrets
  namespace: quantlab
type: Opaque
stringData:
  jwt-secret: "change-me-in-production"
  neo4j-password: "change-me-in-production"
  neo4j-uri: "bolt://neo4j:7687"
  postgres-dsn: "postgresql+asyncpg://quantlab:change-me@postgres:5432/quantlab"
