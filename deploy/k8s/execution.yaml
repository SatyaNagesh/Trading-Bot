apiVersion: apps/v1
kind: Deployment
metadata:
  name: execution-engine
  namespace: quantlab
spec:
  replicas: 2
  selector:
    matchLabels:
      app: execution-engine
  template:
    metadata:
      labels:
        app: execution-engine
    spec:
      containers:
      - name: execution
        image: quantlab/execution:latest
        ports:
        - containerPort: 8005
        resources:
          requests:
            cpu: 250m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: execution-engine
  namespace: quantlab
spec:
  selector:
    app: execution-engine
  ports:
  - port: 8005
    targetPort: 8005
