apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: research-engine-hpa
  namespace: quantlab
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: research-engine
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
---
