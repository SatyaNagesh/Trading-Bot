apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-gateway
  namespace: quantlab
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-gateway
  template:
    metadata:
      labels:
        app: auth-gateway
    spec:
      containers:
      - name: gateway
        image: quantlab/gateway:latest
        ports:
        - containerPort: 8000
        env:
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: quantlab-secrets
              key: jwt-secret
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: 400m
            memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: auth-gateway
  namespace: quantlab
spec:
  type: ClusterIP
  selector:
    app: auth-gateway
  ports:
  - port: 8000
    targetPort: 8000
