apiVersion: apps/v1
kind: Deployment
metadata:
  name: portfolio-engine
  namespace: quantlab
spec:
  replicas: 2
  selector:
    matchLabels:
      app: portfolio-engine
  template:
    metadata:
      labels:
        app: portfolio-engine
    spec:
      containers:
      - name: portfolio
        image: quantlab/portfolio:latest
        ports:
        - containerPort: 8004
        resources:
          requests:
            cpu: 250m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: portfolio-engine
  namespace: quantlab
spec:
  selector:
    app: portfolio-engine
  ports:
  - port: 8004
    targetPort: 8004
