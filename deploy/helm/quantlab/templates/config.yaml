apiVersion: v1
kind: ConfigMap
metadata:
  name: quantlab-config
  namespace: {{ .Release.Namespace }}
data:
  LOG_LEVEL: "{{ .Values.logLevel | default "INFO" }}"
  RABBITMQ_HOST: "{{ .Release.Name }}-rabbitmq"
  RABBITMQ_PORT: "5672"
  REDIS_URL: "redis://{{ .Release.Name }}-redis-master:6379/0"
  QDRANT_HOST: "qdrant"
  QDRANT_PORT: "6333"
  NEO4J_URI: "bolt://neo4j:7687"
  PROMETHEUS_PORT: "9090"
---
apiVersion: v1
kind: Secret
metadata:
  name: quantlab-secrets
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  jwt-secret: "{{ .Values.jwtSecret | default "change-me" }}"
  neo4j-password: "{{ .Values.neo4jPassword | default "change-me" }}"
  postgres-dsn: "postgresql+asyncpg://{{ .Values.postgresql.auth.username }}:{{ .Values.postgresql.auth.password }}@{{ .Release.Name }}-postgresql:5432/{{ .Values.postgresql.auth.database }}"
