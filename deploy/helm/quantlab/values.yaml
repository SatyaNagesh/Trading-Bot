image:
  repository: quantlab
  tag: latest
  pullPolicy: IfNotPresent

replicas:
  research: 2
  strategy: 2
  risk: 2
  portfolio: 2
  execution: 2
  gateway: 2

resources:
  research:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  gateway:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 400m
      memory: 512Mi

postgresql:
  enabled: true
  auth:
    database: quantlab
    username: quantlab
    password: changeme
redis:
  enabled: true
  auth:
    enabled: false
rabbitmq:
  enabled: true
  auth:
    username: guest
    password: guest

ingress:
  enabled: true
  host: quantlab.local
  tls: false

hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPU: 70
  targetMemory: 80
